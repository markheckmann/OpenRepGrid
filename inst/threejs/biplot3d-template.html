<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenRepGrid 3D Biplot</title>
  <style>
{{APP_CSS}}
  </style>
</head>
<body>
  <div id="app">
    <div id="left-panel">
      <div class="tab-bar">
        <button class="tab-btn" data-tab="grid">Grid</button>
        <button class="tab-btn active" data-tab="profile">Profile</button>
        <span class="sort-toggle">
          <label title="Sort constructs by original order">
            <input type="radio" name="construct-sort" value="original"> Original
          </label>
          <label title="Sort constructs by angle in PC1-PC2 plane">
            <input type="radio" name="construct-sort" value="angular" checked> Angular
          </label>
        </span>
      </div>
      <div id="grid-table-container" class="tab-content" data-tab="grid"></div>
      <div id="profile-container" class="tab-content active" data-tab="profile">
        <h3>Element Profile</h3>
        <div class="profile-hint">Hover or click an element in the 3D plot</div>
        <canvas id="profile-canvas"></canvas>
        <button id="remove-benchmarks-btn" style="display:none">Remove all benchmarks</button>
      </div>
    </div>
    <div id="resize-left" class="resize-handle"></div>
    <div id="center-panel">
      <div id="scene-container"></div>
      <button id="toggle-left" class="panel-toggle toggle-left">Grid</button>
      <button id="toggle-right" class="panel-toggle toggle-right">Options</button>
      <div id="tooltip"></div>
      <div id="context-menu"></div>
      <div id="info-bar">Drag to rotate | Scroll to zoom | Right-drag to pan</div>
    </div>
    <div id="resize-right" class="resize-handle"></div>
    <div id="right-panel">
      <div id="gui-panel"></div>
    </div>
  </div>

  <script>
{{THREEJS_LIB}}
  </script>
  <script>
{{ORBIT_LIB}}
  </script>
  <script>
{{CSS2D_LIB}}
  </script>
  <script>
    var BIPLOT_DATA = {{BIPLOT_DATA}};
  </script>
  <script>
{{APP_JS}}
  </script>
</body>
</html>
